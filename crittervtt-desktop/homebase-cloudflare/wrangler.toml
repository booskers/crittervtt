# Homebase on Cloudflare. Deploy with setup-homebase.cmd, or: npx wrangler deploy
name = "critboard-homebase"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# the public address, live.crittervtt.com; Cloudflare makes the DNS records and certificates (both domains' DNS is on
# Cloudflare). critter.poly-chrome.cc was the address before: it stays, for apps and links from before the move
routes = [
  { pattern = "live.crittervtt.com", custom_domain = true },
  { pattern = "critter.poly-chrome.cc", custom_domain = true }
]
# keep the old workers.dev address working for copies installed before the custom domain
workers_dev = true

# the built Critter app, so people can also play in a browser at this Worker's address
[assets]
directory = "../app/www"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# SQLite-backed Durable Objects are the kind the free Workers plan includes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
